name: Cloudflare staging migration
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-staging.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Check Cloudflare configuration
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
      - name: Deploy staging Python Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          uv run pywrangler deploy 2>&1 | tee /tmp/callpilot-cloudflare-deploy.txt
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/callpilot-cloudflare-deploy.txt | tail -n 1 || true)"
          if [ -z "$URL" ]; then
            echo "No workers.dev staging URL found; check whether workers.dev is enabled in Cloudflare."
            exit 1
          fi
          echo "Cloudflare staging endpoint: $URL"
          curl --fail --show-error --silent --retry 3 --retry-delay 3 --max-time 20 "$URL/health" |
             python -c 'import sys,json; d=json.load(sys.stdin); assert d["status"]=="ok" and d["environment"]=="cloudflare-staging" and d["backend_ready"] is False'
